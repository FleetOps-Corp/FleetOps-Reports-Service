# ------------------------------------------------------------------------------
# FleetOps Reports - Pre-commit Configuration
#
# Install:
#   pre-commit install
#
# Run manually:
#   pre-commit run --all-files
# ------------------------------------------------------------------------------

default_language_version:
  python: python3.13

exclude: |
  (?x)^(
      \.git/|
      \.venv/|
      venv/|
      node_modules/|
      __pycache__/|
      \.pytest_cache/|
      \.mypy_cache/|
      \.ruff_cache/|
      htmlcov/|
      build/|
      dist/|
      coverage\.xml|
      \.coverage|
      migrations/
  )

repos:

# ------------------------------------------------------------------------------
# General file checks
# ------------------------------------------------------------------------------

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace

      - id: end-of-file-fixer

      - id: check-yaml
        args: [--unsafe]

      - id: check-json

      - id: check-toml

      - id: check-added-large-files
        args:
          - --maxkb=2048

      - id: check-merge-conflict

      - id: check-case-conflict

      - id: detect-private-key

      - id: mixed-line-ending

# ------------------------------------------------------------------------------
# Ruff
# ------------------------------------------------------------------------------

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff
        args:
          - --fix

      - id: ruff-format

# ------------------------------------------------------------------------------
# MyPy
# ------------------------------------------------------------------------------

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.1
    hooks:
      - id: mypy
        language_version: python3.13
        args:
          - --ignore-missing-imports
        additional_dependencies:
          - types-requests
          - types-PyYAML

# ------------------------------------------------------------------------------
# Security
# ------------------------------------------------------------------------------

  - repo: https://github.com/PyCQA/bandit
    rev: "1.8.6"
    hooks:
      - id: bandit
        args:
          - --severity-level
          - medium
        exclude: ^tests/

# ------------------------------------------------------------------------------
# YAML
# ------------------------------------------------------------------------------

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args:
          - --config-data
          - "{extends: default, rules: {line-length: {max: 120}}}"

# ------------------------------------------------------------------------------
# Dockerfile
# ------------------------------------------------------------------------------

  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.1-beta
    hooks:
      - id: hadolint

# ------------------------------------------------------------------------------
# Markdown
# ------------------------------------------------------------------------------

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        args:
          - --fix
