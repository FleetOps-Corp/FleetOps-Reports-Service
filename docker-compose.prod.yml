# Production-oriented Compose stack for EC2 / single-node deployment.
# SAD Traceability: lean runtime (gateway, backend, MinIO) with optional profiles.
#
# Default services: gateway, backend, minio
# Optional profile "embedded-db": local MongoDB container (skip when using Atlas M0)
# Optional profile "observability": Prometheus, Grafana, Loki, Promtail
#
# Usage examples:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#   docker compose -f docker-compose.prod.yml --profile embedded-db --env-file .env up -d --build
#   docker compose -f docker-compose.prod.yml --profile observability --env-file .env up -d --build

services:
  gateway:
    build:
      context: ./gateway
    user: "101:101"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${GATEWAY_HTTP_PORT}:8080"
    networks:
      - fleetops_reports_net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    user: "10001:10001"
    env_file:
      - path: .env
        required: true
    depends_on:
      minio:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - backend_logs:/var/log/fleetops-reports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fleetops_reports_net
    restart: unless-stopped

  minio:
    build:
      context: ./minio
    user: "10001:10001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY}"
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mc alias set local http://127.0.0.1:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" && mc ready local"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - fleetops_reports_net
    restart: unless-stopped

  mongodb:
    profiles: ["embedded-db"]
    image: mongo:7.0.12
    user: "999:999"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD}"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\""
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fleetops_reports_net
    restart: unless-stopped

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.53.1
    user: "65534:65534"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fleetops_reports_net
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.1.0
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
    ports:
      - "${GRAFANA_HTTP_PORT}:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - fleetops_reports_net
    restart: unless-stopped

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.1.0
    user: "10001:10001"
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - fleetops_reports_net
    restart: unless-stopped

  promtail:
    profiles: ["observability"]
    image: grafana/promtail:3.1.0
    user: "10001:10001"
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - backend_logs:/var/log/fleetops-reports:ro
    depends_on:
      - loki
    networks:
      - fleetops_reports_net
    restart: unless-stopped

networks:
  fleetops_reports_net:
    driver: bridge

volumes:
  mongodb_data:
  minio_data:
  loki_data:
  backend_logs:
