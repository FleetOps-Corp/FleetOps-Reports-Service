// SAD Traceability: Vehicles service contract from ADR-001 and processes 10.1/10.4.
syntax = "proto3";

package fleetops.vehicles.v1;

service VehiclesService {
  // Coincide con la llamada real de infraestructura del GrpcVehiclesClient
  rpc GetAllVehicles (ListVehiclesRequest) returns (ListVehiclesResponse);
}

message ListVehiclesRequest {
  bool only_active = 1;                 // Filtro operativo para optimización de consultas
}

message VehicleMessage {
  string id_vehiculo = 1;               // UUID v4 inmutable
  string numero_placa = 2;              // Placa física real (ej: 'TYX-789')
  string estado_vehiculo = 3;           // DISPONIBLE, EN_MANTENIMIENTO, RESERVADO...
  string ciudad_operacion = 4;          // Sucursal o nodo de operación asignado
  string marca = 5;                     // Fabricante
  string modelo = 6;                    // Modelo comercial
}

message ListVehiclesResponse {
  repeated VehicleMessage vehicles = 1;
}
