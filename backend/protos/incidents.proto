// SAD Traceability: Incidents service contract from ADR-001 and process 10.3.
syntax = "proto3";

package fleetops.incidents.v1;

service IncidentesService {
  // Coincide con la llamada real de infraestructura del GrpcIncidentsClient
  rpc GetIncidents (IncidentQueryRequest) returns (ListIncidentsResponse);
}

// Permitimos un mensaje de consulta flexible alineado a la infraestructura
message IncidentQueryRequest {}

message IncidentMessage {
  string id = 1;              // ID legible: 'INC-YYYYMMDD-XXXX'
  string fecha_hora = 2;      // Instante del suceso (ISO 8601)
  string id_conductor = 3;    // ID del operador involucrado
  string placa_vehiculo = 4;  // Placa física del activo (ej: 'ABC-123')
  string tipo_incidente = 5;  // 'HUMANO' o 'MECANICO'
  string gravedad = 6;        // 'LEVE' o 'GRAVE'
}

message ListIncidentsResponse {
  repeated IncidentMessage incidents = 1;
}
