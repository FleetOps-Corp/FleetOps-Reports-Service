// SAD Traceability: Assignments service contract from ADR-001 and process 10.4.
syntax = "proto3";

package fleetops.assignments.v1;

service AsignacionesService {
  // Coincide con la llamada real de infraestructura del GrpcAssignmentsClient
  rpc ListAllAssignments (ListAssignmentsRequest) returns (ListAssignmentsResponse);
}

message ListAssignmentsRequest {}

message AssignmentMessage {
  string id = 1;              // UUID inmutable de la asignación
  string vehiculo_id = 2;     // UUID del vehículo (puede venir vacío/nulo)
  string conductor_id = 3;    // UUID de relación con el operador
  string tipo_vehiculo = 4;   // Categoría autorizada (ej: 'CAMION')
  string fecha_inicio = 5;    // Timestamp en formato DATE string (YYYY-MM-DD)
  string fecha_fin = 6;       // Timestamp en formato DATE string (YYYY-MM-DD)
}

message ListAssignmentsResponse {
  repeated AssignmentMessage assignments = 1;
}
