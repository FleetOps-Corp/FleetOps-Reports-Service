# SAD Traceability: static type validation across architectural layers.
[mypy]
python_version = 3.12
mypy_path = src
packages = fleetops_reports
plugins = pydantic.mypy
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = (?x)(
    ^src/fleetops_reports/infrastructure/grpc_clients/generated/
    )

[pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[mypy-fleetops_reports.infrastructure.grpc_clients.generated.*]
ignore_errors = true
