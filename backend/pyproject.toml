# SAD Traceability: Python 3.13/FastAPI/httpx/Beanie/MinIO/WeasyPrint stack
# from the SAD technology table and prompt testing requirements.

[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"
[project]
name = "fleetops-reports"
version = "0.1.0"
description = "FleetOps Reports analytical microservice archetype"
requires-python = "==3.13.*"
dependencies = [
  "fastapi==0.115.11",
  "uvicorn[standard]==0.34.3",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "beanie==2.1.0",
  "minio==7.2.15",
  "httpx>=0.28",
  "Jinja2==3.1.6",
  "WeasyPrint==68.0",
  "prometheus-client==0.22.1",
  "python-json-logger==3.3.0",
  "requests",
  "pyyaml"
]

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
  "pytest-asyncio==1.0.0",
  "coverage==7.9.1"
]
lint = [
  "import-linter==2.1",
  "mypy==1.16.1",
  "ruff==0.12.0",
  "types-requests",
  "types-PyYAML"
]
security = [
  "bandit==1.8.6",
  "pip-audit==2.8.0"
]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.0.0",
  "coverage==7.9.1",
  "import-linter==2.1",
  "mypy==1.16.1",
  "ruff==0.12.0",
  "types-requests",
  "types-PyYAML",
  "bandit==1.8.6",
  "pip-audit==2.8.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fleetops_reports.infrastructure.templates" = ["html/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "."]

[tool.coverage.run]
branch = true
source = [
  "src/fleetops_reports/domain",
  "src/fleetops_reports/application"
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
partial_branches = [
  "\\.\\.\\.",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "UP", "B", "SIM"
]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["fleetops_reports"]
