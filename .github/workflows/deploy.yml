name: FleetOps Reports Deployment

run-name: >
  deploy -
  ${{ github.event_name }} -
  ${{ github.ref_name }}

on:
  workflow_run:
    workflows:
      - FleetOps Reports Continuous Integration
    types:
      - completed
    branches:
      - main
      - develop

  workflow_dispatch:
    inputs:
      deploy_branch:
        description: Git branch to deploy on the EC2 host
        required: false
        default: main
        type: string

concurrency:
  group: fleetops-reports-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    if: |
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' || 
        github.event.workflow_run.head_branch == 'develop'))

    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_branch || 'main' }}

    steps:
      - name: Validate deployment secrets
        run: |
          test -n "${{ secrets.EC2_HOST }}" || (echo "Missing EC2_HOST secret" && exit 1)
          test -n "${{ secrets.EC2_USER }}" || (echo "Missing EC2_USER secret" && exit 1)
          test -n "${{ secrets.EC2_SSH_KEY }}" || (echo "Missing EC2_SSH_KEY secret" && exit 1)

      - name: Deploy application stack over SSH
        uses: appleboy/ssh-action@7a7d4af958a0eaf3dd858875b38ea05115e99750 # v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          envs: DEPLOY_PATH,DEPLOY_BRANCH
          script: |
            set -euo pipefail

            TARGET_DIR="${DEPLOY_PATH:-/opt/fleetops-reports}"
            BRANCH="${DEPLOY_BRANCH:-main}"

            echo "Deploying FleetOps Reports to ${TARGET_DIR} (branch: ${BRANCH})"

            cd "${TARGET_DIR}"

            if [ ! -d .git ]; then
              echo "Repository not found at ${TARGET_DIR}. Clone the project first."
              exit 1
            fi

            git fetch origin
            git checkout "${BRANCH}"
            git pull --ff-only origin "${BRANCH}"

            if [ ! -f .env ]; then
              echo "Missing .env file. Copy .env.production.example and configure secrets."
              exit 1
            fi

            docker compose -f docker-compose.prod.yml --env-file .env up -d --build --remove-orphans
            docker compose -f docker-compose.prod.yml --env-file .env ps

            GATEWAY_PORT="$(grep -E '^GATEWAY_HTTP_PORT=' .env | cut -d= -f2- | tr -d '\r' || true)"
            GATEWAY_PORT="${GATEWAY_PORT:-8081}"
            curl --fail --silent --show-error "http://127.0.0.1:${GATEWAY_PORT}/health"

      # Optional future phase: pull pre-built images from a container registry.
      # Requires CI to publish images (see TODO-FASE-DOCKER in ci.yml) and these secrets:
      #   GHCR_USERNAME, GHCR_TOKEN, DOCKER_IMAGE, DOCKER_TAG
      #
      # - name: Log in to GitHub Container Registry
      #   if: false
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ secrets.GHCR_USERNAME }}
      #     password: ${{ secrets.GHCR_TOKEN }}
