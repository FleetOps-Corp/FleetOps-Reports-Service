# -----------------------------------------------------------------------------
# Project
# -----------------------------------------------------------------------------

sonar.projectKey=FleetOps-Corp_FleetOps-Reports-Service
sonar.projectName=FleetOps Reports
sonar.projectVersion=2.0.0

# Obligatorio en SonarCloud
sonar.organization=fleetops-corp

# New-code baseline for branch analysis (develop is integration branch)
sonar.newCode.referenceBranch=develop

# -----------------------------------------------------------------------------
# Sources
# -----------------------------------------------------------------------------

sonar.sources=backend/src/fleetops_reports
sonar.tests=backend/tests
sonar.inclusions=backend/src/fleetops_reports/domain/**,backend/src/fleetops_reports/application/**
sonar.sourceEncoding=UTF-8

# -----------------------------------------------------------------------------
# Python
# -----------------------------------------------------------------------------

sonar.python.version=3.13
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.bandit.reportPaths=bandit-report.json

# -----------------------------------------------------------------------------
# Exclusions
# -----------------------------------------------------------------------------

sonar.exclusions=\
**/__pycache__/**,\
**/.venv/**,\
**/.github/**,\
**/venv/**,\
**/node_modules/**,\
**/htmlcov/**,\
**/.pytest_cache/**,\
**/.mypy_cache/**,\
**/.ruff_cache/**,\
**/migrations/**,\
**/observability/**,\
**/gateway/**,\
minio/**,\
docs/**,\
scripts/**,\
backend/scripts/**,\
backend/protos/**,\
**/*.proto,\
**/*.egg-info/**,\
**/tests/**,\
**/infrastructure/**,\
**/presentation/**,\
**/composition/**,\
**/config/**,\
**/main.py,\
Makefile,\
README.md,\
bandit-report.json,\
**/docker-compose*.yml,\
**/pyproject.toml

sonar.coverage.exclusions=\
**/tests/**,\
**/*test*.py,\
**/__init__.py,\
**/infrastructure/**,\
**/presentation/**,\
**/composition/**,\
**/config/**,\
**/main.py,\
docs/**,\
scripts/**,\
backend/scripts/**,\
backend/protos/**

sonar.cpd.exclusions=\
**/tests/**,\
docs/**,\
scripts/**

# -----------------------------------------------------------------------------
# Analysis
# -----------------------------------------------------------------------------

sonar.verbose=false
