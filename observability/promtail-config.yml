# SAD Traceability: Promtail ships structured backend logs to Loki for SAD 10.7.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: fleetops-reports-file
    static_configs:
      - targets:
          - localhost
        labels:
          job: fleetops-reports
          service: backend
          __path__: /var/log/fleetops-reports/*.log

